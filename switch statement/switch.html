<!DOCTYPE html>
<HTML>
	<body>
		<h1>Switch statement</h1>
		<p id="demo"></p>
	</body>
	<script>
		color = prompt("Enter color");
		switch(color){
			case "blue":
			alert("hera bete");
			break;
			case "red":
			alert("chaman");
			break;
			case "yellow":
			alert("pila");
			break;
			default:
			alert("not found");
		}
		document.getElementById("demo").innerHTML=color;

	</script>
</HTML>
